  - name: T1574.013 - Stage Unbacked Memory Stub and Link KernelCallbackTable Slot
    description: |
      Simulates an adversary allocating an unbacked private memory region to stage a decoy callback stub and linking it to a table slot.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTStagedStub {
            [DllImport("kernel32.dll")] public static extern IntPtr VirtualAlloc(IntPtr lpAddress, UIntPtr dwSize, uint flAllocationType, uint flProtect);
            [DllImport("kernel32.dll")] public static extern bool VirtualFree(IntPtr lpAddress, UIntPtr dwSize, uint dwFreeType);
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Execute() {
                IntPtr stub = VirtualAlloc(IntPtr.Zero, (UIntPtr)1024, 0x1000 | 0x2000, 0x40);
                Marshal.WriteByte(stub, 0xC3);
                Environment.SetEnvironmentVariable("T1574_STUB_PTR", stub.ToString("X"), EnvironmentVariableTarget.Process);

                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                IntPtr slotAddr = IntPtr.Add(table, 4 * IntPtr.Size);
                IntPtr original = Marshal.ReadIntPtr(slotAddr);
                Environment.SetEnvironmentVariable("T1574_ORIG_04", original.ToString("X"), EnvironmentVariableTarget.Process);

                uint oldProt;
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, 0x04, out oldProt);
                Marshal.WriteIntPtr(slotAddr, stub);
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, oldProt, out oldProt);
                Console.WriteLine("[+] Staged unbacked memory stub and linked to table slot.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTStagedStub]::Execute()
      cleanup_command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTStagedClean {
            [DllImport("kernel32.dll")] public static extern bool VirtualFree(IntPtr lpAddress, UIntPtr dwSize, uint dwFreeType);
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Cleanup(string origHex, string stubHex) {
                if (!string.IsNullOrEmpty(origHex)) {
                    PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                    int ret = 0;
                    NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                    IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                    if (table != IntPtr.Zero) {
                        IntPtr slotAddr = IntPtr.Add(table, 4 * IntPtr.Size);
                        IntPtr orig = (IntPtr)Convert.ToInt64(origHex, 16);
                        uint oldProt;
                        VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, 0x04, out oldProt);
                        Marshal.WriteIntPtr(slotAddr, orig);
                        VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, oldProt, out oldProt);
                    }
                }
                if (!string.IsNullOrEmpty(stubHex)) {
                    IntPtr stub = (IntPtr)Convert.ToInt64(stubHex, 16);
                    VirtualFree(stub, UIntPtr.Zero, 0x8000);
                }
                Console.WriteLine("[+] Cleaned up staged memory stub and restored table slot.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTStagedClean]::Cleanup($env:T1574_ORIG_04, $env:T1574_STUB_PTR)

  - name: T1574.013 - Multi-Slot KernelCallbackTable Tampering Simulation
    description: |
      Simulates an adversary performing concurrent pointer overwrites across multiple function slots in the KernelCallbackTable.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTMultiHijack {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Execute() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                uint oldProt;
                VirtualProtect(table, (UIntPtr)4096, 0x04, out oldProt);
                for (int i = 1; i <= 3; i++) {
                    IntPtr slotAddr = IntPtr.Add(table, i * IntPtr.Size);
                    IntPtr orig = Marshal.ReadIntPtr(slotAddr);
                    Environment.SetEnvironmentVariable("T1574_MULTIORIG_" + i, orig.ToString("X"), EnvironmentVariableTarget.Process);
                    Marshal.WriteIntPtr(slotAddr, orig);
                }
                VirtualProtect(table, (UIntPtr)4096, oldProt, out oldProt);
                Console.WriteLine("[+] Multiple KernelCallbackTable slots simulated successfully.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTMultiHijack]::Execute()
      cleanup_command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTMultiClean {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Cleanup(string o1, string o2, string o3) {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                string[] origs = { o1, o2, o3 };
                uint oldProt;
                VirtualProtect(table, (UIntPtr)4096, 0x04, out oldProt);
                for (int i = 1; i <= 3; i++) {
                    if (!string.IsNullOrEmpty(origs[i - 1])) {
                        IntPtr slotAddr = IntPtr.Add(table, i * IntPtr.Size);
                        Marshal.WriteIntPtr(slotAddr, (IntPtr)Convert.ToInt64(origs[i - 1], 16));
                    }
                }
                VirtualProtect(table, (UIntPtr)4096, oldProt, out oldProt);
                Console.WriteLine("[+] Restored all multi-slot pointers.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTMultiClean]::Cleanup($env:T1574_MULTIORIG_1, $env:T1574_MULTIORIG_2, $env:T1574_MULTIORIG_3)

