attack_technique: T1574.013
display_name: T1574.013 - Core Telemetry and Structural Validation Suite for KernelCallbackTable Hijacking

atomic_tests:
  - name: T1574.013 - Temporary Overwrite of __fnCOPYDATA Slot with Safe Stub Pointer
    description: |
      Simulates an adversary modifying the __fnCOPYDATA function pointer slot within the process's KernelCallbackTable to redirect message handling.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTHijack1 {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Execute() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;
                
                IntPtr slotAddr = IntPtr.Add(table, 7 * IntPtr.Size);
                IntPtr original = Marshal.ReadIntPtr(slotAddr);
                Environment.SetEnvironmentVariable("T1574_ORIG_01", original.ToString("X"), EnvironmentVariableTarget.Process);
                
                uint oldProt;
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, 0x04, out oldProt);
                Marshal.WriteIntPtr(slotAddr, original); // Safe benign write pointing to self for stability
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, oldProt, out oldProt);
                Console.WriteLine("[+] __fnCOPYDATA slot successfully simulated and patched.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTHijack1]::Execute()
      cleanup_command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTCleanup1 {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Cleanup(string origHex) {
                if (string.IsNullOrEmpty(origHex)) return;
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                IntPtr slotAddr = IntPtr.Add(table, 7 * IntPtr.Size);
                IntPtr orig = (IntPtr)Convert.ToInt64(origHex, 16);
                uint oldProt;
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, 0x04, out oldProt);
                Marshal.WriteIntPtr(slotAddr, orig);
                VirtualProtect(slotAddr, (UIntPtr)IntPtr.Size, oldProt, out oldProt);
                Console.WriteLine("[+] Restored original __fnCOPYDATA pointer.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTCleanup1]::Cleanup($env:T1574_ORIG_01)

  - name: T1574.013 - Modify KernelCallbackTable Memory Protection Page Permissions
    description: |
      Simulates an adversary changing memory page protections of the KernelCallbackTable region from read-only to read-write prior to patching.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTProtTest {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Execute() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                uint oldProt;
                bool success = VirtualProtect(table, (UIntPtr)4096, 0x40, out oldProt);
                Environment.SetEnvironmentVariable("T1574_OLDPROT", oldProt.ToString(), EnvironmentVariableTarget.Process);
                Console.WriteLine("[+] KernelCallbackTable page permission altered to RWX: " + success);
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTProtTest]::Execute()
      cleanup_command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTProtClean {
            [DllImport("ntdll.dll")] public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);
            [StructLayout(LayoutKind.Sequential)] public struct PROCESS_BASIC_INFORMATION { public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4; }
            [DllImport("kernel32.dll")] public static extern bool VirtualProtect(IntPtr lpAddress, UIntPtr dwSize, uint flNewProtect, out uint lpflOldProtect);

            public static void Cleanup(string protStr) {
                if (string.IsNullOrEmpty(protStr)) return;
                uint oldProt = uint.Parse(protStr);
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return;

                uint dummy;
                VirtualProtect(table, (UIntPtr)4096, oldProt, out dummy);
                Console.WriteLine("[+] Restored original table page permissions.");
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTProtClean]::Cleanup($env:T1574_OLDPROT)

