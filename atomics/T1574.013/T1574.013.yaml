attack_technique: T1574.013
display_name: T1574.013 - Core Telemetry and Structural Validation Suite for KernelCallbackTable Hijacking

atomic_tests:
  - name: T1574.013 - Local PEB Base Address Resolution
    description: |
      Queries the Process Environment Block (PEB) base address of the current process 
      using the native NT API NtQueryInformationProcess.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class PEBLocator {
            [DllImport("ntdll.dll")]
            public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);

            [StructLayout(LayoutKind.Sequential)]
            public struct PROCESS_BASIC_INFORMATION {
                public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4;
            }

            public static IntPtr GetPEB() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                return pbi.PebBaseAddress;
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        $peb = [PEBLocator]::GetPEB()
        Write-Host "[+] PEB Base Address: $peb"
      cleanup_command: |
        Write-Host "[+] Cleanup complete."

  - name: T1574.013 - KernelCallbackTable Pointer Extraction (PEB + 0x58)
    description: |
      Extracts the memory address pointer located at PEB + 0x58 (64-bit systems), 
      which points directly to the process's active KernelCallbackTable.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTExtractor {
            [DllImport("ntdll.dll")]
            public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);

            [StructLayout(LayoutKind.Sequential)]
            public struct PROCESS_BASIC_INFORMATION {
                public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4;
            }

            public static IntPtr GetTable() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                return Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        $kct = [KCTExtractor]::GetTable()
        Write-Host "[+] KernelCallbackTable Pointer: $kct"
      cleanup_command: |
        Write-Host "[+] Cleanup complete."

  - name: T1574.013 - Count Active KernelCallbackTable Function Pointer Entries
    description: |
      Iterates through the function pointer array starting from the KernelCallbackTable base 
      to count active consecutive slots until a null boundary is reached.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class KCTCounter {
            [DllImport("ntdll.dll")]
            public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);

            [StructLayout(LayoutKind.Sequential)]
            public struct PROCESS_BASIC_INFORMATION {
                public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4;
            }

            public static void CountSlots() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table != IntPtr.Zero) {
                    int count = 0;
                    for (int i = 0; i < 200; i++) {
                        IntPtr ptr = Marshal.ReadIntPtr(table, i * IntPtr.Size);
                        if (ptr == IntPtr.Zero) break;
                        count++;
                    }
                    Console.WriteLine("[*] Active KernelCallbackTable Entries Counted: " + count);
                }
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        [KCTCounter]::CountSlots()
      cleanup_command: |
        Write-Host "[+] Cleanup complete."

  - name: T1574.013 - Inspect __fnCOPYDATA Message Dispatcher Slot
    description: |
      Directly inspects the function slot within the KernelCallbackTable array responsible 
      for handling WM_COPYDATA messages (__fnCOPYDATA).
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $Source = @"
        using System;
        using System.Runtime.InteropServices;
        public class CopyDataSlotChecker {
            [DllImport("ntdll.dll")]
            public static extern int NtQueryInformationProcess(IntPtr h, int c, ref PROCESS_BASIC_INFORMATION p, int l, ref int r);

            [StructLayout(LayoutKind.Sequential)]
            public struct PROCESS_BASIC_INFORMATION {
                public IntPtr Reserved1, PebBaseAddress, Reserved2, Reserved3, UniqueProcessId, Reserved4;
            }

            public static IntPtr GetCopyDataSlot() {
                PROCESS_BASIC_INFORMATION pbi = new PROCESS_BASIC_INFORMATION();
                int ret = 0;
                NtQueryInformationProcess(System.Diagnostics.Process.GetCurrentProcess().Handle, 0, ref pbi, Marshal.SizeOf(pbi), ref ret);
                IntPtr table = Marshal.ReadIntPtr(pbi.PebBaseAddress, 0x58);
                if (table == IntPtr.Zero) return IntPtr.Zero;
                return Marshal.ReadIntPtr(table, 7 * IntPtr.Size);
            }
        }
        "@
        Add-Type -TypeDefinition $Source -ErrorAction Stop
        $slot = [CopyDataSlotChecker]::GetCopyDataSlot()
        Write-Host "[+] __fnCOPYDATA Slot Pointer: $slot"
      cleanup_command: |
        Write-Host "[+] Cleanup complete."

