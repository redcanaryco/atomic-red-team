  - name: T1574.013 - Simulate KernelCallbackTable Integrity Disruption via Slot Zeroing
    description: |
      Simulates an adversary disrupting system integrity checks by temporarily zeroing out active function pointer slots in the KernelCallbackTable.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
