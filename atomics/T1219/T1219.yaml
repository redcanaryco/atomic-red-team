- name: TeamViewer Files Detected Test on Windows
  auto_generated_guid: 8ca3b96d-8983-4a7f-b125-fc98cc0a2aa0
  description: |
    An adversary may attempt to trick the user into downloading teamviewer and using this to maintain access to the machine. Download of TeamViewer installer will be at the destination location when sucessfully executed.
  supported_platforms:
  - windows

  dependencies:
  - description: |
      TeamViewer installer must exist on disk at the specified location (#{installer_path})
    prereq_command: |
      if(Test-Path "#{installer_path}") {
          exit 0
      } else {
          exit 1
      }
    get_prereq_command: |
      $parentpath = Split-Path "#{installer_path}"
      New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null
      Invoke-WebRequest -Uri #{download_url} -OutFile "#{installer_path}"


  input_arguments:
    installer_path:
      description: where the installer will be downloaded to or already is located
      type: path
      default: PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe

    download_url:
      description: url to download teamviewer from
      type: url
      default: https://download.teamviewer.com/download/TeamViewer_Setup_x64.exe

  executor:
    command: |
      Start-Process -Wait "#{installer_path}" /S;
      Start-Process 'C:\Program Files\TeamViewer\TeamViewer.exe'
    cleanup_command: |-
      $file = 'C:\Program Files\TeamViewer\uninstall.exe'
      if(Test-Path $file){ Start-Process $file "/S" -ErrorAction Ignore | Out-Null }
      Remove-Item "#{installer_path}" -ErrorAction Ignore | Out-Null

      Get-ChildItem "C:\Users\*\AppData\Local" "TeamViewer" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
      $Directory = $_.ToString()
      Remove-Item $Directory -Recurse -Force -ErrorAction SilentlyContinue
      }
    name: powershell
    elevation_required: true
