attack_technique: T1129
display_name: "Shared Modules"
atomic_tests:
- name: ESXi - Install a custom VIB on an ESXi host 
  auto_generated_guid: 7f843046-abf2-443f-b880-07a83cf968ec
  description: |
    An adversary can maintain persistence within an ESXi host by installing malicious vSphere Installation Bundles (VIBs).
    [Reference](https://www.mandiant.com/resources/blog/esxi-hypervisors-malware-persistence)
  supported_platforms:
  - windows
  input_arguments:
    vm_host:
      description: Specify the host name of the ESXi Server
      type: string
      default: atomic.local
    vm_user:
      description: Specify the privilege user account on ESXi Server
      type: string
      default: root
    vm_pass:
      description: Specify the privilege user password on ESXi Server
      type: string
      default: pass
    plink_file:
      description: Path to plink
      type: path
      default: 'PathToAtomicsFolder\..\ExternalPayloads\plink.exe'
    pscp_file:
      description: Path to Pscp
      type: path
      default: 'PathToAtomicsFolder\..\ExternalPayloads\pscp.exe'
    vib_install:
      description: Path to script with commands to install the vib
      type: path
      default: PathToAtomicsFolder\..\atomics\T1129\src\esxi_vibinstall.txt
    vib_remove:
      description: Path to script with commands to remove the vib
      type: path
      default: PathToAtomicsFolder\..\atomics\T1129\src\esxi_vibremove.txt
    vib_file:
      description: Path to the dummy vib
      type: path
      default: PathToAtomicsFolder\..\atomics\T1129\src\atomicvibes.vib
  dependency_executor_name: powershell
  dependencies:
  - description: |
      Check if plink and pscp are available.
    prereq_command: |
      if (Test-Path "#{plink_file}") {exit 0} else {exit 1}
      if (Test-Path "#{pscp_file}") {exit 0} else {exit 1}
    get_prereq_command: |
      New-Item -Type Directory "PathToAtomicsFolder\..\ExternalPayloads\" -ErrorAction Ignore -Force | Out-Null
      Invoke-WebRequest "https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe" -OutFile "PathToAtomicsFolder\..\ExternalPayloads\plink.exe" -UseBasicParsing
      Invoke-WebRequest "https://the.earth.li/~sgtatham/putty/latest/w64/pscp.exe" -OutFile "PathToAtomicsFolder\..\ExternalPayloads\pscp.exe" -UseBasicParsing
  executor:
    command: |
       #{pscp_file} -pw #{vm_pass} #{vib_file} #{vm_user}@#{vm_host}:/tmp
       echo "" | "#{plink_file}" "#{vm_host}" -ssh  -l "#{vm_user}" -pw "#{vm_pass}" -m "#{vib_install}"
    cleanup_command: |
       echo "" | "#{plink_file}" "#{vm_host}" -ssh  -l "#{vm_user}" -pw "#{vm_pass}" -m "#{vib_remove}"
    name: command_prompt
    elevation_required: false
- name: Execute a Shared Module (dylib) via a Generic Loader
  auto_generated_guid: 85a0c684-e29c-4896-977f-f82a2fe8cf2e
  description: |
    Executes arbitrary code from a compiled dylib by loading it with a generic, built-in loader
    (Python's `ctypes.CDLL`, which calls `dlopen` under the hood) rather than launching it as its own
    process image. The dylib's constructor function runs automatically as soon as it is loaded,
    similar to abusing `rundll32` on Windows to execute code from a DLL without a dedicated
    launcher/dropper binary.
  supported_platforms:
  - macos
  input_arguments:
    dylib_source:
      description: Source for the shared module (dylib) to be loaded.
      type: path
      default: PathToAtomicsFolder/T1129/src/MacOS/T1129.c
    dylib_path:
      description: Path to the compiled shared module.
      type: path
      default: /tmp/T1129_module.dylib
  dependency_executor_name: bash
  dependencies:
  - description: |
      The shared module must be compiled and present at #{dylib_path}
    prereq_command: |
      if [ -f #{dylib_path} ]; then exit 0; else exit 1; fi
    get_prereq_command: |
      gcc -dynamiclib #{dylib_source} -o #{dylib_path}
  executor:
    command: |
      python3 -c "import ctypes; ctypes.CDLL('#{dylib_path}')"
      cat /tmp/T1129_module_loaded.txt
    cleanup_command: |
      rm -f #{dylib_path} /tmp/T1129_module_loaded.txt
    name: bash
    elevation_required: false
