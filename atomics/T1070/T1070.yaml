attack_technique: T1070
display_name: "Indicator Removal"
atomic_tests:
- name: Indicator Removal using FSUtil
  auto_generated_guid: b4115c7a-0e92-47f0-a61e-17e7218b2435
  description: |
    Manages the update sequence number (USN) change journal, which provides a persistent log of all changes made to files on the volume. Upon execution, no output
    will be displayed. More information about fsutil can be found at https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-usn
  supported_platforms:
  - windows
  executor:
    command: |
      fsutil usn deletejournal /D C:
    cleanup_command: |
      fsutil usn createjournal m=1000 a=100 c:
    name: command_prompt
    elevation_required: true
- name: Indicator Manipulation using FSUtil
  auto_generated_guid: 96e86706-6afd-45b6-95d6-108d23eaf2e9
  description: |
    Finds a file by user name (if Disk Quotas are enabled), queries allocated ranges for a file, sets a file's short name, sets a file's valid data length, sets zero data for a file, or creates a new file. Upon execution, no output
    will be displayed. More information about fsutil can be found at https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-file
    - https://tria.ge/230601-x8x6bsgb24/behavioral2
  supported_platforms:
  - windows
  input_arguments:
    file_to_manipulate:
      description: Path of file to manipulate
      type: path
      default: PathToAtomicsFolder\..\ExternalPayloads\T1070-2.txt
    file_data_length:
      description: Data length to setzero
      type: integer
      default: 10
  executor:
    command: |
      if (-not (Test-Path "#{file_to_manipulate}")) { New-Item "#{file_to_manipulate}" -Force } 
      echo "1234567890" > "#{file_to_manipulate}"
      fsutil  file setZeroData offset=0 length=#{file_data_length} "#{file_to_manipulate}"
    cleanup_command: |
      rm "#{file_to_manipulate}"
    name: powershell
    elevation_required: false
- name: Clear Shell History
  auto_generated_guid: cfaf8a2a-4f8b-42ca-aed7-a36db536bc19
  description: |
    Clears the current user's bash and zsh history files and the in-memory shell history, removing a
    record of commands the adversary has run. This is a common cleanup step adversaries perform after
    manual, hands-on-keyboard activity on a compromised macOS host.
  supported_platforms:
  - macos
  executor:
    command: |
      cat /dev/null > ~/.bash_history
      cat /dev/null > ~/.zsh_history
      history -c 2>/dev/null || true
    name: bash
    elevation_required: false
- name: Clear Quarantine Events Database
  auto_generated_guid: 53733cf8-726c-484c-8c74-6a322f89a90d
  description: |
    Deletes all rows from the user's LaunchServices QuarantineEventsV2 database, which is the same
    database `com.apple.quarantine` extended attributes reference. Clearing it removes forensic
    evidence of when and from where files (including the adversary's own payloads) were downloaded,
    without needing to touch the quarantine attribute on any individual file.
  supported_platforms:
  - macos
  input_arguments:
    quarantine_db:
      description: Path to the user's Quarantine Events database.
      type: path
      default: $HOME/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2
  executor:
    command: |
      cp "#{quarantine_db}" /tmp/T1070_QuarantineEventsV2.bak
      sqlite3 "#{quarantine_db}" "DELETE FROM LSQuarantineEvent;"
      sqlite3 "#{quarantine_db}" "SELECT count(*) FROM LSQuarantineEvent;"
    cleanup_command: |
      cp /tmp/T1070_QuarantineEventsV2.bak "#{quarantine_db}"
      rm -f /tmp/T1070_QuarantineEventsV2.bak
    name: bash
    elevation_required: false
