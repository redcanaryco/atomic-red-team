attack_technique: T1692.001
display_name: Command Message
atomic_tests:
- name: Unauthorized Modbus Write to a Protected Register
  auto_generated_guid: 8f2c1e5a-6b3d-4a7e-9c0f-1d5b8e2a4c6f
  description: |
    Sends an unsolicited Modbus/TCP WRITE_SINGLE_REGISTER (function code 6) command
    message to a target device, simulating an adversary issuing an unauthorized write
    to a register the source has no legitimate reason to modify. This is the ATT&CK
    for ICS T1692.001 pattern of sending a command message outside the normal control
    logic to manipulate a device's operating state.

    Point --host at a Modbus/TCP device or simulator you are authorized to test
    against (e.g. a lab PLC, or a local `pymodbus` server). Sends exactly one
    request; performs no scanning or brute forcing.
  supported_platforms:
  - linux
  - macos
  input_arguments:
    host:
      description: Target Modbus/TCP device or simulator.
      type: string
      default: 127.0.0.1
    port:
      description: Target Modbus/TCP port.
      type: integer
      default: 502
    address:
      description: Register address to write to.
      type: integer
      default: 150
    value:
      description: Value to write into the register.
      type: integer
      default: 255
    path_to_script:
      description: Path to the Modbus command-message script.
      type: path
      default: PathToAtomicsFolder/T1692.001/src/modbus_command_message.py
  dependency_executor_name: sh
  dependencies:
  - description: |
      Check if python3 exists on the machine.
    prereq_command: |
      if [ -x "$(command -v python3)" ]; then exit 0; else exit 1; fi;
    get_prereq_command: |
      (which apt-get && DEBIAN_FRONTEND=noninteractive apt-get install -y python3)||(which yum && yum -y install python3)||(which pkg && pkg install -y python3)
  executor:
    command: |
      python3 "#{path_to_script}" --host #{host} --port #{port} --mode write --address #{address} --value #{value}
    name: sh
- name: Modbus Command Message Using a Reserved/Illegal Function Code
  auto_generated_guid: 3a7d9c1b-4e6f-4b2a-8d5c-7f1a3e9b2c5d
  description: |
    Sends a Modbus/TCP command message using a diagnostics/reserved function code
    (default 8) that a typical field device does not serve during normal operation
    -- an ATT&CK for ICS T1692.001 pattern used to probe or trigger unexpected
    device behavior via an out-of-policy command message, distinct from a
    legitimate read/write request.

    Point --host at a Modbus/TCP device or simulator you are authorized to test
    against. Sends exactly one request; performs no scanning or brute forcing.
  supported_platforms:
  - linux
  - macos
  input_arguments:
    host:
      description: Target Modbus/TCP device or simulator.
      type: string
      default: 127.0.0.1
    port:
      description: Target Modbus/TCP port.
      type: integer
      default: 502
    function_code:
      description: Reserved/diagnostics function code to send.
      type: integer
      default: 8
    path_to_script:
      description: Path to the Modbus command-message script.
      type: path
      default: PathToAtomicsFolder/T1692.001/src/modbus_command_message.py
  dependency_executor_name: sh
  dependencies:
  - description: |
      Check if python3 exists on the machine.
    prereq_command: |
      if [ -x "$(command -v python3)" ]; then exit 0; else exit 1; fi;
    get_prereq_command: |
      (which apt-get && DEBIAN_FRONTEND=noninteractive apt-get install -y python3)||(which yum && yum -y install python3)||(which pkg && pkg install -y python3)
  executor:
    command: |
      python3 "#{path_to_script}" --host #{host} --port #{port} --mode illegal --function-code #{function_code}
    name: sh
