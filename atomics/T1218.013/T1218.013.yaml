  - name: T1218.013 - Mavinject Injection with NTFS Alternate Data Stream (ADS) Carrier
    auto_generated_guid: 0d9bf912-4e16-42e8-a13e-8652fd16538a
    description: |
      Simulates an adversary passing a payload stored inside an NTFS Alternate Data Stream to mavinject.exe for process injection.
