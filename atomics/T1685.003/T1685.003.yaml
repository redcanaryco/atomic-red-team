attack_technique: T1685.003
display_name: "Disable or Modify Tools: Modify or Spoof Tool UI"

atomic_tests:
  - name: T1685.003 - Suppress Action Center and Security Notifications via Registry Modification
    auto_generated_guid: 2d6fa33d-49ee-483c-9cb6-c579dc29cc47
    description: |
      Simulates an adversary modifying registry policies to suppress security alerts and disable notifications within the Action Center UI.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: true
      command: Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings" -Name "NOC_GLOBAL_SETTING_ALLOW_TOAST_WHILE_DND" -Value 0 -ErrorAction SilentlyContinue; Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications" -Name "NoToastApplicationNotification" -Value 1 -ErrorAction SilentlyContinue; Write-Host "[+] Simulated UI notification suppression applied."
      cleanup_command: Remove-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings" -Name "NOC_GLOBAL_SETTING_ALLOW_TOAST_WHILE_DND" -ErrorAction SilentlyContinue; Remove-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications" -Name "NoToastApplicationNotification" -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up notification suppression settings."

  - name: T1685.003 - Modify TrayNotify Icon Streams to Simulate Taskbar Icon Spoofing
    auto_generated_guid: 1d103cba-6f51-4246-b984-3e6c90ecef70
    description: |
      Simulates an adversary tampering with user tray icon stream registry values to hide or manipulate security tool icons in the taskbar.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: $regPath = "HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\CurrentVersion\TrayNotify"; if (Test-Path -Path $regPath) { $backup = Get-ItemProperty -Path $regPath -Name "IconStreams" -ErrorAction SilentlyContinue; if ($null -ne $backup) { Set-ItemProperty -Path $regPath -Name "T1685_Backup" -Value $backup.IconStreams }; Set-ItemProperty -Path $regPath -Name "IconStreams" -Value ([byte[]](0..15)) -ErrorAction SilentlyContinue; Write-Host "[+] Simulated tray icon stream modification executed." }
      cleanup_command: $regPath = "HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\CurrentVersion\TrayNotify"; if (Test-Path -Path $regPath) { $backup = Get-ItemProperty -Path $regPath -Name "T1685_Backup" -ErrorAction SilentlyContinue; if ($null -ne $backup) { Set-ItemProperty -Path $regPath -Name "IconStreams" -Value $backup.T1685_Backup; Remove-ItemProperty -Path $regPath -Name "T1685_Backup" -ErrorAction SilentlyContinue }; Write-Host "[+] Cleaned up tray icon stream simulation." }

  - name: T1685.003 - Disable Security Center Notifications via WSC Registry Modification
    auto_generated_guid: d659c40d-df83-4975-8dfc-5c7de06bd666
    description: |
      Simulates adversary tampering with Action Center settings to disable security alerts and falsify operational status reporting.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: true
      command: $path = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WSC"; if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }; Set-ItemProperty -Path $path -Name "DisableNotifications" -Value 1 -ErrorAction SilentlyContinue; Write-Host "[+] Simulated Security Center notification disablement executed."
      cleanup_command: Remove-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WSC" -Name "DisableNotifications" -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up Security Center notification settings."

